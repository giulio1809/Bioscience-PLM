[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tem1-zero-shot"
version = "0.1.0"
description = "ESM-2 masked-marginal baseline for ProteinGym TEM-1 mutation effects"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "torch>=2.6,<3",
  "transformers==4.57.1",
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "matplotlib>=3.8,<4",
]

[project.scripts]
tem1 = "tem1.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
